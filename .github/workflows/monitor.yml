name: freshness monitor

# Guards against silent pipeline death. If daily.yml errors outright, GitHub sends its own
# failure email; but it can also REPORT SUCCESS WHILE PRODUCING NO DATA — and in that state
# every green light is false.
# This workflow independently reads the latest date in the ledger data itself and fails with
# a non-zero exit code when stale, triggering GitHub's native failure notification by email
# rather than posting to a channel nobody reads.
#
# NOTE: this workflow never uses constructs like `if: always()` that would mask a failure —
#       a monitor that raises false all-clears is more dangerous than no monitor at all.
on:
  schedule:
    # Primary: shortly after midnight New York (05:10 UTC = 00:10 EST / 01:10 EDT),
    # Tue–Sat UTC so every Mon–Fri trading day is checked the night it closes.
    # Staleness must never exceed one day: the checker compares the ledger's last row
    # against the last COMPLETED US trading day read off SPY's own bars.
    - cron: "10 5 * * 2-6"
    # Backup sweep: scheduled events are best-effort and get dropped in platform
    # incidents (both daily crons were swallowed on 2026-08-06) — the monitor itself
    # must not hang on a single trigger. Read-only, so running twice costs nothing.
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      # The gate proves itself alive before it is allowed to judge the ledger. On 2026-08-18
      # the calendar reader mistook Yahoo's unpopulated `close` field for "no trading session"
      # and denounced an honest row as future-dated; the selftest pins that case plus the
      # negative ones, so a future edit cannot quietly loosen it. A failure here means the
      # monitor is broken, not the ledger — do not read it as an all-clear either way.
      - name: monitor selftest
        run: python -m src.check_freshness --selftest

      # The channel is part of the response, and §11.3 grades responses by reversibility.
      # Until 2026-08-18 every non-zero exit produced the same red "All jobs have failed"
      # email, so the attribution the checker had worked out — ledger vs vendor — died at
      # the last metre and the reader could not triage without opening the run. Worse, a
      # vendor hole nobody can act on paged exactly as loudly as a corrupted ledger, which
      # is precisely how a monitor teaches its reader to ignore it.
      #
      #   0  fresh                         notice, pass
      #   1  THE LEDGER is wrong           error, FAIL -> email, act now
      #   2  source blind, < 1 session     warning, pass -> visible in the run, no email
      #   3  source blind, and it stuck    error, FAIL -> email; verification itself is lost
      #   *  anything else                 error, FAIL — an unrecognised state is never green
      - name: check ledger freshness
        shell: bash
        run: |
          set +e
          python -m src.check_freshness | tee /tmp/freshness.txt
          code=${PIPESTATUS[0]}
          set -e
          { echo "### Freshness monitor (exit ${code})"; echo '```'; cat /tmp/freshness.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          head1=$(head -1 /tmp/freshness.txt)
          case "$code" in
            0) echo "::notice title=Ledger fresh::${head1}" ;;
            1) echo "::error title=LEDGER FAULT — a human is needed now::${head1}"; exit 1 ;;
            2) echo "::warning title=Source blind (transient) — the ledger is NOT accused::${head1}" ;;
            3) echo "::error title=SOURCE BLIND TOO LONG — the ledger cannot be verified at all::${head1}"; exit 1 ;;
            *) echo "::error title=Monitor returned an unrecognised exit code ${code}::Treated as failure on purpose — an unknown state is never an all-clear."; exit 1 ;;
          esac
