name: "演练: 失败邮件测试 (drill, no ledger writes)"

# One-off drill, 2026-09-16: does GitHub's native failure email actually reach the inbox
# (not a Gmail filter/archive)? This workflow has no checkout and no write permission —
# it cannot touch the ledger, constituents, or anything else. It is removed after the drill.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: deliberate failure (演练)
        run: |
          echo "演练: deliberate failure to test failure-email delivery. No data touched."
          exit 1
